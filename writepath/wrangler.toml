# wrangler.toml — names and placeholders only. No secret is ever written here.
#
# Nothing in this directory has been created on Cloudflare. Creating the Worker,
# the D1 database and the GitHub OAuth App is the instructor's, by hand, in the
# order README.md gives.
#
# Secrets, set once each with `wrangler secret put NAME` and read from `env`:
#
#   wrangler secret put GITHUB_CLIENT_ID       # the OAuth App's client id
#   wrangler secret put GITHUB_CLIENT_SECRET   # the OAuth App's client secret
#   wrangler secret put SESSION_KEY            # 32+ random bytes; signs session cookies
#   wrangler secret put PULL_TOKEN             # the bearer the node sends to /pull
#
# The client id is not strictly a secret, but it is kept with the other three so
# that the repository holds no account-specific value at all.

name = "sketchgen-writepath"
main = "worker.js"
workers_dev = true
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "sketchgen-writepath"
database_id = "c345cb25-700d-41c2-a9a2-fbd47b6db26b"

[vars]
GALLERY_URL = "https://profcarroll.github.io/sketchgen-gallery"
# Kiosks that play a local render from their own loopback (docs/plans/
# local-gallery.md §1.6). They may read /counts and post kiosk views to /view,
# and nothing else; a non-loopback origin here is ignored. Space-separated.
# kiosk-mac serves the render on 127.0.0.1:8090.
KIOSK_ORIGINS = "http://127.0.0.1:8090 http://localhost:8090"
