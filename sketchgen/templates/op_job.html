<h1>Job $id <span class="pill $state_class">$state</span>
  <span class="dim" style="font-size:13px">— attempt $attempt_n of $max_attempts</span></h1>

<section class="panel">
  <p class="mono">$prompt</p>
  <div class="tiles">
$tiles
  </div>
  <div class="actions">
    <form method="post" action="/job/$id/cancel">
      <button type="submit" class="danger"$cancel_dis
              title="move to failed with 'cancelled by operator'">Cancel job</button>
    </form>
    <form method="post" action="/job/$id/laptop">
      <button type="submit"$laptop_dis
              title="park in needs-laptop for the paid path (spec section 6)">Send to laptop</button>
    </form>
  </div>
</section>

<section class="panel">
  <h2>Transcript — <span class="dim" style="text-transform:none">last $log_lines lines of job.log</span></h2>
  <pre id="log" data-job="$id">$log</pre>
</section>

$attempts

<section class="panel">
  <h2>Provenance so far</h2>
  <table><tbody>
$provenance
  </tbody></table>
</section>
