<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title — sketchgen</title>
<style>
:root {
  --bg: #f7f7f5; --fg: #1b1b19; --dim: #6a6a64; --line: #d8d8d2;
  --panel: #ffffff; --accent: #2b5d9b; --bar: #2b5d9b; --bar-bg: #e4e4de;
  --ok: #2f7d43; --warn: #9a6a00; --bad: #a33226; --code: #f0f0ec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17181a; --fg: #e6e6e2; --dim: #9a9a92; --line: #33353a;
    --panel: #1f2124; --accent: #7fb0e8; --bar: #5c93d6; --bar-bg: #2a2c30;
    --ok: #6fbf84; --warn: #d9a63c; --bad: #e0796c; --code: #191b1e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
}
a { color: var(--accent); }
/* The header is two rows on the Held page and one everywhere else, and both of
   them have to stay on screen: the tray's Process button is what card 40 is
   marked for, and scrolling back up to find it is the whole reason the tray is
   in the header at all. So the sticky box is this wrapper rather than
   header.top, and a page with no subheader sticks exactly as it did. */
.sticky { position: sticky; top: 0; z-index: 5; }
header.top {
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
  justify-content: space-between; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel);
}
header.top nav { display: flex; gap: 14px; flex-wrap: wrap; align-items: baseline; }
header.top nav a { text-decoration: none; padding: 2px 0; }
header.top nav a.here { font-weight: 600; border-bottom: 2px solid var(--accent); }
.brand { font-weight: 700; letter-spacing: .02em; margin-right: 6px; }
/* The nav's live marks. A five-segment level meter after Console: lit
   segments are node CPU in fifths, coloured by how far up the meter they
   are — the first two green, the third amber, the last two red. The counts
   after Queue and the superscripts after Held and Gallery use the pill's own
   vocabulary: amber waits, green moves, red failed. */
.throttle { display: inline-flex; gap: 2px; vertical-align: -1px; margin-left: 2px; }
.throttle i { display: inline-block; width: 7px; height: 10px;
              border-radius: 2px; background: var(--bar-bg); }
.throttle i.on { background: var(--warn); }
.throttle i.on:nth-child(n+4) { background: var(--bad); }
.throttle i.on:nth-child(-n+2) { background: var(--ok); }
.counts { font-size: 12px; letter-spacing: .02em; margin-left: 2px; }
.counts .n { font-variant-numeric: tabular-nums; font-weight: 600; }
.counts .n.ok { color: var(--ok); }
.counts .n.warn { color: var(--warn); }
.counts .n.bad { color: var(--bad); }
.sup { font-size: 10px; font-weight: 700; vertical-align: super;
       line-height: 0; color: var(--dim); font-variant-numeric: tabular-nums; }
.sup.warn { color: var(--warn); }
/* The tokens gauge, after the meter: tokens completed per five-minute bin
   over the last two hours, so the meter's "now" has the shape of the session
   behind it. The accent, not the meter's amber — throughput is not a
   warning — and the decode rate beside it in the dim colour, because on this
   node that number barely moves and is a label rather than news. */
.spark { vertical-align: -3px; margin-left: 2px; max-width: 100%; }
.spark-area { fill: var(--accent); opacity: .18; }
.spark-line { fill: none; stroke: var(--accent); stroke-width: 1.2;
              stroke-linejoin: round; }
.spark-now { fill: var(--accent); }
.tok { font-size: 12px; color: var(--dim); }
.tok .n { font-variant-numeric: tabular-nums; font-weight: 600; }
.spark-wide .spark { display: block; margin: 2px 0; }
.spark-wide .lab.dim { color: var(--dim); }
.control { display: flex; gap: 8px; align-items: center; }
.control form { display: flex; gap: 6px; margin: 0; }
button {
  font: inherit; padding: 4px 10px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--panel); color: var(--fg); cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .4; cursor: default; }
button.danger { color: var(--bad); }
.pill {
  display: inline-block; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 12px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase;
}
.pill.running, .pill.published, .pill.held { border-color: var(--ok); color: var(--ok); }
.pill.pausing, .pill.stopping, .pill.repairing, .pill.gating,
.pill.planning, .pill.executing, .pill.queued { border-color: var(--warn); color: var(--warn); }
.pill.paused, .pill.failed, .pill.rejected, .pill.needs-laptop { border-color: var(--bad); color: var(--bad); }
/* The status card's own four: a running job step, work the worker gives
   itself, a step that has outlasted every other one of its kind, and a worker
   that is not there. Idle is the quiet treatment rather than green — an idle
   worker is not a working one. */
.pill.ok { border-color: var(--ok); color: var(--ok); }
.pill.warn { border-color: var(--warn); color: var(--warn); }
.pill.bad { border-color: var(--bad); color: var(--bad); }
.pill.quiet { border-color: var(--line); color: var(--dim); }
/* The batch tray: the second row of the sticky header, on /held and nowhere
   else. It is one <form>, and every toggle and box on every card below joins it
   by form="held-batch", so the cards stay siblings in the grid and the page has
   exactly one request in it — this button. What the tally says the press will
   do is what the press does, which is why there is no confirm dialog. */
.tray { background: var(--panel); border-bottom: 1px solid var(--line); padding: 8px 16px; }
.tray-in { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.tray-row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
/* These three set display themselves, which beats the browser's own [hidden]
   rule; without this an idle tray would show an empty bar. */
.tray-row[hidden], .phases[hidden], .results[hidden] { display: none; }
.tray h1 { font-size: 16px; margin: 0; }
.tray h1 .dim { font-size: 12px; font-weight: 400; }
.tally { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; flex: 1 1 200px; }
.tally .t {
  font-size: 12px; font-variant-numeric: tabular-nums; padding: 1px 9px;
  border-radius: 999px; border: 1px solid currentColor; white-space: nowrap;
}
.tally .t.pub { color: var(--ok); }
.tally .t.rej { color: var(--bad); }
.tally .t.cri { color: var(--accent); }
.tally .t.arc { color: var(--dim); }
/* A marked Critique with an empty box: dashed, amber, and Process is dead
   until it is typed or unmarked. One sentence cannot be a reason and a
   revision at once, so this is the one mark the page will not let through. */
.tally .t.need { color: var(--warn); border-style: dashed; }
.tally .none { font-size: 12px; color: var(--dim); }
.tray-btns { display: flex; gap: 6px; margin-left: auto; }
button.process {
  font-weight: 600; background: var(--accent); border-color: var(--accent);
  color: var(--panel); padding: 5px 16px; font-variant-numeric: tabular-nums;
}
button.process:hover:not(:disabled) { filter: brightness(1.08); }
/* Counted in real steps — one per critique, one per archive, one per entry
   committed, one for the push, one for the index — and never in elapsed time:
   there is no median here for a batch to be measured against. */
.tray .bar { flex: 1 1 160px; }
.tray .bar > span { transition: width .3s ease; }
.tray .bar.done > span { background: var(--ok); }
@media (prefers-reduced-motion: reduce) { .tray .bar > span { transition: none; } }
.tray .prog-t { font-size: 12px; color: var(--dim); white-space: nowrap;
                font-variant-numeric: tabular-nums; }
.tray .now { font-size: 14px; font-weight: 600; flex: 1 1 260px; overflow-wrap: anywhere; }
.phases { display: flex; flex-wrap: wrap; gap: 4px 14px; list-style: none; margin: 0;
          padding: 0; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.phases li.on { color: var(--fg); font-weight: 600; }
.phases li.fin { color: var(--ok); }
.phases li.fin::before { content: "\2713 "; }
.phases li.on::before { content: "\203a "; color: var(--accent); }
.results { list-style: none; margin: 0; padding: 0; font-size: 12px; }
.results li { padding: 3px 0; border-top: 1px solid var(--line); display: flex; gap: 8px;
              align-items: baseline; overflow-wrap: anywhere; }
.results .n { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 2.4em; }
.results .bad { color: var(--bad); }
main { padding: 16px; max-width: 1100px; margin: 0 auto; }
h1 { font-size: 19px; margin: 0 0 14px; }
h2 { font-size: 15px; margin: 0 0 10px; text-transform: uppercase;
     letter-spacing: .07em; color: var(--dim); }
h3 { font-size: 14px; margin: 14px 0 6px; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px; margin: 0 0 16px;
}
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.tile { border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
.tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); }
.tile .v { font-size: 18px; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 11px; color: var(--dim); }
.bar { display: flex; background: var(--bar-bg); border-radius: 3px; height: 9px; overflow: hidden; }
.bar > span { display: block; flex: none; height: 100%; background: var(--bar); }
.bar > span.cache { background: var(--dim); }
/* The status card's bar says one of three things, and the track is always
   drawn so that saying a different one moves nothing below it. A fill is a
   measured step. A moving ribbon is a step that is running and cannot be
   measured — fewer than five of it have finished on this node, and some steps
   (claiming is instant, sweeping happens twice a week) will never have five.
   An empty track is a worker that is napping, paused or gone. One stripe
   period per 900 ms: slow enough not to nag on a screen that is left open all
   day, fast enough to read as motion at nine pixels tall. */
.bar.working {
  background-image: repeating-linear-gradient(-45deg,
    color-mix(in srgb, var(--accent) 50%, transparent) 0 6px,
    transparent 6px 12px);
  background-size: 17px 100%;                 /* 12px × √2: one stripe period */
  animation: ribbon 900ms linear infinite;
}
.bar.working.late {
  background-image: repeating-linear-gradient(-45deg,
    color-mix(in srgb, var(--warn) 55%, transparent) 0 6px,
    transparent 6px 12px);
}
@keyframes ribbon { to { background-position: 17px 0; } }
/* Still stripes still read as "not the empty track", which is the whole job. */
@media (prefers-reduced-motion: reduce) { .bar.working { animation: none; } }
/* The process status card: the now line, who is doing it, elapsed against the
   median of that step, and the three steps just before. The worker is a
   different process from this one and blocks inside a single HTTP call for a
   whole step, so there is no heartbeat to animate — the bar is elapsed over
   the median and it stops at the end of its track and turns amber, because a
   step that is over its median should look stuck rather than look finished.
   No median (fewer than five samples of that step) draws no bar at all. */
.panel.status .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.panel.status .head h2 { margin: 0; }
.panel.status .now { font-size: 17px; margin: 10px 0 3px; }
.panel.status .who { font-size: 12px; color: var(--dim); margin: 0 0 10px;
                     overflow-wrap: anywhere; }
.panel.status .prog { display: flex; align-items: center; gap: 10px; }
.panel.status .prog .bar { flex: 1 1 auto; }
.panel.status .prog .t { font-size: 12px; color: var(--dim); white-space: nowrap;
                         font-variant-numeric: tabular-nums; }
.panel.status .bar > span.over { background: var(--warn); }
.panel.status .trail ol { list-style: none; margin: 12px 0 0; padding: 0; }
.panel.status .trail li { display: flex; justify-content: space-between; gap: 10px;
                          font-size: 12px; color: var(--dim); padding: 3px 0;
                          border-top: 1px solid var(--line); }
.panel.status .trail li .h { overflow-wrap: anywhere; }
.panel.status .trail li .s { font-variant-numeric: tabular-nums; white-space: nowrap; }
.panel.status .foot { font-size: 12px; color: var(--dim); margin: 12px 0 0; }
/* The Queue's copy: the same card on one line above the jobs table. It wraps
   rather than scrolls — at 400px the pill and the headline hold the first
   line and the detail takes the second. */
.panel.status.compact { display: flex; flex-wrap: wrap; align-items: baseline;
                        gap: 6px 10px; }
.panel.status.compact .now { font-weight: 600; }
.panel.status.compact .who { flex: 1 1 220px; font-size: 12px; color: var(--dim);
                             margin: 0; overflow-wrap: anywhere; }
.panel.status.compact .more { margin-left: auto; white-space: nowrap; font-size: 12px; }
.cores { display: grid; gap: 4px 10px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.core { display: grid; grid-template-columns: 22px 1fr 42px; gap: 6px; align-items: center;
        font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
.meter { margin: 0 0 10px; }
.meter .lab { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
td.n, th.n { text-align: right; }
tr.job:hover { background: var(--code); }
pre, code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
pre {
  background: var(--code); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px; overflow: auto; max-height: 22em; font-size: 12px; margin: 0;
}
.flash {
  margin: 12px 16px 0; padding: 8px 12px; border: 1px solid var(--accent);
  border-radius: 6px; background: var(--panel); max-width: 1100px;
}
.flash.warn { border-color: var(--bad); border-width: 2px; font-weight: 600; }
.flash.warn::before { content: "⚠ "; color: var(--bad); }
.dim { color: var(--dim); }
.checks li { list-style: none; }
.checks { padding-left: 0; margin: 4px 0; }
.checks .yes { color: var(--ok); }
.checks .no { color: var(--bad); }
.checks .na { color: var(--dim); }
.cards { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.card img, .shot img { max-width: 100%; border: 1px solid var(--line); border-radius: 5px; }
iframe.preview {
  display: block; max-width: 100%; border: 1px solid var(--line);
  border-radius: 5px; background: #000;
}
/* Click to run. Nothing on this page autoplays since 2026-09-15: a held sketch
   that allocates a GPU buffer per line() per frame costs the operator's machine
   the same as it cost the gate, and the Held page used to start all of them at
   once. The poster is the strip the gate saw; the frame is built by
   PREVIEW_SCRIPT on a click and removed on stop. */
.preview-run { position: relative; display: inline-block; max-width: 100%; }
.preview-run button.play {
  display: block; padding: 0; border: 1px solid var(--line); border-radius: 5px;
  background: #000; cursor: pointer; overflow: hidden; line-height: 0;
  max-width: 100%;
}
.preview-run button.play img { display: block; max-width: 100%; border: 0;
                               border-radius: 4px; }
.preview-run .no-still {
  display: block; padding: 28px 16px; color: var(--dim); font-size: 12px;
  line-height: 1.4;
}
.preview-run .play-label {
  position: absolute; left: 8px; bottom: 8px; padding: 3px 10px;
  border-radius: 999px; background: rgba(0, 0, 0, .66); color: #fff;
  font-size: 12px; line-height: 1.5; letter-spacing: .04em;
}
/* While running the poster is hidden and the button would collapse to a sliver
   under the iframe, so the button itself becomes the pill; a click on the
   label then lands on the button and not on the sandboxed frame. */
.preview-run.running button.play {
  position: absolute; left: 8px; bottom: 8px; z-index: 1;
  border-color: var(--accent); border-radius: 999px;
  padding: 3px 10px; line-height: 1.5; background: rgba(0, 0, 0, .66);
}
/* ...and the label, a child of that button, sits inline in it. */
.preview-run.running .play-label { position: static; padding: 0; background: none; }
.preview-run.running button.play img { display: none; }
.chip.cost {
  display: inline-block; padding: 1px 9px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 12px; font-variant-numeric: tabular-nums;
  color: var(--dim); margin-right: 4px;
}
.chip.cost.warn { border-color: var(--bad); color: var(--bad); font-weight: 600; }
details.preview-fold { margin: 10px 0 0; }
details.preview-fold > summary {
  cursor: pointer; font-size: 12px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--dim); margin-bottom: 8px;
}
form.stack label { display: block; margin: 10px 0 3px; font-size: 12px;
                   text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
form.stack input[type=text], form.stack input[type=number], form.stack textarea,
form.stack select {
  font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--bg); color: var(--fg);
}
form.stack textarea { min-height: 6em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px;
  font-size: 13px; margin: 0; text-transform: none; letter-spacing: normal;
  color: var(--fg); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
/* form.stack's label rule (block, uppercase, a margin) outranks .chip on
   specificity, so the chips used to come out as shouting blocks with the
   size boxes stacked under them. Named at the same rank, a chip is a chip. */
form.stack label.chip, label.chip {
  display: inline-flex; align-items: center; gap: 3px; margin: 0; text-transform: none;
  letter-spacing: normal; font-size: 13px; color: var(--fg); cursor: pointer;
  white-space: nowrap; }
.chip input { margin: 0 4px 0 0; }
form.stack .chip input[type=number], .chip input[type=number] {
  width: 4.5em; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); color: var(--fg); font: inherit; font-size: 12px; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
/* The New job page (2026-09-18). A prompt panel, then who and what it
   descends from side by side, then the assertions, then the run options with
   the one primary button and the two default buttons pushed to the right.
   The submitter is a pill when this node knows the operator's GitHub login
   and a box only when it does not; the parent is a card you can see rather
   than a number you have to trust. */
.newjob h2 { margin-bottom: 8px; }
.newjob .help { font-size: 12px; color: var(--dim); margin: 8px 0 0; line-height: 1.5; }
.newjob .help code { font-size: 11px; background: var(--code); padding: 0 4px; border-radius: 3px; }
.newjob textarea { min-height: 7em; font-size: 15px; }
.newjob .opts { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
                margin-top: 8px; font-size: 12px; color: var(--dim); }
.newjob .opts label { display: inline; margin: 0; text-transform: none; letter-spacing: normal;
                      font-size: 12px; color: var(--fg); cursor: pointer; }
.newjob .opts input { margin-right: 5px; vertical-align: -1px; }
button.link { border: 0; background: none; padding: 0; color: var(--accent);
              text-decoration: underline; font-size: inherit; cursor: pointer; }
button.link:hover { border: 0; }
.signed { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin: 2px 0 0;
          font-size: 12px; }
.signed .pill { text-transform: none; letter-spacing: 0; font-size: 13px; }
.parent-card { display: flex; gap: 12px; align-items: flex-start; margin-top: 10px; }
.parent-card img { width: 180px; max-width: 40%; flex: none; border: 1px solid var(--line);
                   border-radius: 5px; }
.parent-card > div { min-width: 0; flex: 1 1 auto; }
.parent-card .meta { margin: 0 0 4px; font-size: 12px; }
.parent-card .prompt { margin: 4px 0; overflow-wrap: anywhere; }
.parent-card .rev { margin: 2px 0; font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
.parent-card .rev .k { text-transform: uppercase; letter-spacing: .05em; font-size: 10px; }
.pick-fold, .recent-fold { margin-top: 12px; }
.pick-fold > summary, .recent-fold > summary {
  cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--dim); }
.picks { display: grid; gap: 6px; margin-top: 8px; }
.pick { display: grid; grid-template-columns: 56px 3em auto minmax(0, 1fr); gap: 8px;
        align-items: center; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
        text-decoration: none; color: var(--fg); font-size: 12px; }
.pick:hover { border-color: var(--accent); }
.pick.on { border-color: var(--accent); background: var(--code); }
.pick img, .pick .no-img { display: block; width: 56px; height: 28px; object-fit: cover;
                           border-radius: 3px; border: 1px solid var(--line); }
.pick .no-img { background: var(--bar-bg); }
.pick .n { font-weight: 700; font-variant-numeric: tabular-nums; }
.pick .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent { list-style: none; margin: 6px 0 0; padding: 0; font-size: 13px; }
.recent li { padding: 4px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.recent li .dim { font-size: 12px; }
.newjob .actions { align-items: center; }
.newjob .actions .spacer { flex: 1 1 auto; }
.newjob .actions .note { font-size: 12px; color: var(--dim); }
.row > * { flex: 1 1 160px; }
.err { color: var(--bad); }
.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.actions form { margin: 0; }
/* The decision card: one number, one image, one input, four verbs. The card
   used to print the entry id six times, in the heading and in every button
   label, and drew the gate's four-frame strip twice — once as the run button's
   poster and once again underneath. What is left says each thing once, so the
   type does the ranking instead: the number is the heading, the prompt is the
   sentence, the revision is the critique, the meta line is provenance.
   The Held grid is minmax(300px, 1fr) and this is drawn to fit there: every
   row wraps and nothing has a min-width wider than the column, so a phone
   scrolls down and never sideways. */
.card .id { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline;
            margin: 0 0 10px; }
.card .id .n { font-size: 22px; font-weight: 700; line-height: 1.1;
               font-variant-numeric: tabular-nums; }
.card .id .dim { font-size: 12px; }
/* The poster fills the card; the cost chip sits under it, not a line away. */
.card .preview-run { display: block; }
.card .preview-run button.play, .card .preview-run button.play img { width: 100%; }
.card .preview-run + p { margin: 6px 0 0; }
.card .prompt { margin: 10px 0 0; font-weight: 600; }
.card .rev { margin: 4px 0 0; font-style: italic; }
.card .rev .k {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-style: normal; font-size: 11px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--dim); margin-right: 4px;
}
.card .meta { margin: 8px 0 0; font-size: 12px; color: var(--dim); }
.card .say { margin: 12px 0 0; }
.card .say input[type=text] {
  font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--line);
  border-radius: 5px; background: var(--bg); color: var(--fg);
}
/* Four verbs, one colour each, in the order a decision is usually made. They
   wrap before they shrink: a button whose label is cut in half is a button
   pressed by mistake. On /submissions they are still buttons and still act on
   the press; on /held they are the toggles below, which only mark. */
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
.acts button { flex: 1 1 auto; }
.acts button:hover:not(:disabled) { border-color: currentColor; }
.acts .pub { color: var(--ok); }
.acts .rej { color: var(--bad); }
.acts .cri { color: var(--accent); }
.acts .arc { color: var(--dim); }
/* The same four verbs on /held, where they mark instead of acting: outline at
   rest, filled with their own colour when on. The radio or checkbox covers the
   whole label and is invisible but focusable — the fill is input:checked + span
   and the focus ring is input:focus-visible + span, so the control a keyboard
   lands on is the control a pointer presses, and neither needs a script. */
.tog { flex: 1 1 auto; position: relative; display: flex; }
.tog input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%;
             margin: 0; cursor: pointer; }
.tog span { flex: 1; text-align: center; padding: 4px 10px; border: 1px solid var(--line);
            border-radius: 5px; background: var(--panel); white-space: nowrap; }
.tog:hover span { border-color: currentColor; }
.tog.pub { color: var(--ok); }
.tog.rej { color: var(--bad); }
.tog.cri { color: var(--accent); }
.tog.arc { color: var(--dim); }
.tog.pub input:checked + span { background: var(--ok); border-color: var(--ok);
                                color: var(--panel); font-weight: 600; }
.tog.rej input:checked + span { background: var(--bad); border-color: var(--bad);
                                color: var(--panel); font-weight: 600; }
.tog.cri input:checked + span { background: var(--accent); border-color: var(--accent);
                                color: var(--panel); font-weight: 600; }
.tog.arc input:checked + span { background: var(--dim); border-color: var(--dim);
                                color: var(--panel); font-weight: 600; }
.tog input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.tog input:disabled { cursor: default; }
.tog input:disabled + span { opacity: .4; }
.card .hint { margin: 8px 0 0; font-size: 12px; color: var(--dim); }
/* The hint says what Process will do to this one card, in one sentence, and
   turns amber for a mark the page will refuse and red for a reason it came
   back with. The min-height is so that sentence changing length moves nothing
   below it. */
.card .decide-hint { min-height: 2.9em; }
.card .hint.warn { color: var(--warn); }
.card .hint.bad { color: var(--bad); }
.card .say input.need { border-color: var(--warn); }
/* A decision card is as tall as its row, and the controls sit on the floor of
   it, so the four verbs line up across a row whose prompts are different
   lengths. Marked: the card's own border says so, at any scroll position. */
.card.decide { display: flex; flex-direction: column; position: relative; }
.card.decide .say { margin: auto 0 0; padding-top: 12px; }
.card.marked { border-color: var(--fg); }
.card.is-working { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card.is-done { opacity: .45; }
/* What the batch is doing to this entry, while it is doing it. It belongs
   beside the entry's own state pill and it is drawn by the card rather than by
   _card_face, which /entry/<id> shares and which has no batch to report. */
.card .pill.st { position: absolute; top: 14px; right: 14px; }
.card.has-state .id { padding-right: 96px; }
/* The submissions card is the decision card with the sentence where the sketch
   is. What the operator is deciding about is a line of text somebody typed, so
   that line is the largest thing on the card and the person who typed it is a
   chip beside the number rather than a line of provenance underneath. A
   critique's parent keeps the card's existing shapes above it — .prompt and
   .rev — so the two cards read as one design. */
.card .ask { margin: 12px 0 0; font-size: 17px; line-height: 1.35;
             overflow-wrap: anywhere; }
.chip.person { padding: 1px 9px; font-size: 12px; color: var(--dim); }
/* Entry states the queue's pills never show: the gate's own rejection, and
   the shelf. Same vocabulary as the site's chips. */
.pill.failed-kept { border-color: var(--bad); color: var(--bad); }
.pill.archived { border-color: var(--dim); color: var(--dim); }
</style>
</head>
<body>
<div class="sticky">
<header class="top">
  <nav><span class="brand">sketchgen</span>$nav</nav>
  <div class="control">
    <span class="pill $pill_class" id="worker-pill" title="$pill_title">$pill_text</span>
    <form method="post" action="/control">
      <input type="hidden" name="back" value="$back">
      <button type="submit" name="action" value="pause"$pause_dis
              title="finish the attempt in flight, then stop">Pause</button>
      <button type="submit" name="action" value="stop" class="danger"$stop_dis
              title="abort the attempt in flight and re-queue the job">Stop now</button>
      <button type="submit" name="action" value="resume"$resume_dis>Resume</button>
    </form>
  </div>
</header>
$subheader
</div>
$flash
<main>
$body
</main>
<script>
// The header pill and the nav's marks, kept honest without a reload. Two
// seconds, one small GET: the same response carries both, and the server has
// already rendered all of it once, so a reader with no JS sees it too.
(function () {
  var pill = document.getElementById("worker-pill");
  if (!pill) return;
  function at(key) { return document.querySelector('[data-nav="' + key + '"]'); }
  function mark(key, value, title) {
    var el = at(key);
    if (!el) return;
    el.textContent = value;
    if (title) el.title = title;
  }
  function meter(nav) {
    var el = at("cpu");
    if (!el) return;
    var cpu = Math.max(0, Math.min(100, Number(nav.cpu_pct) || 0));
    var lit = Math.round(cpu / 20);
    for (var i = 0; i < el.children.length; i++) {
      el.children[i].className = i < lit ? "on" : "";
    }
    el.title = "node CPU " + Math.round(cpu) + "% · slot " + nav.slot_state +
               (nav.slot_holder ? " (" + nav.slot_holder + ")" : "");
  }
  // The sparkline's geometry — the same formula as _spark_points() in
  // web.py, line for line, so a repainted bin lands exactly where the server
  // drew it: x = 1 + i*(w-2)/(n-1), y = (h-1) - v/peak*(h-4), and a window
  // with nothing in it flat on the baseline. Rounded to a tenth before it is
  // printed, because toFixed and Python's %.1f break ties in opposite
  // directions and the two sides have to agree as strings.
  function sparkPoints(bins, w, h) {
    var n = Math.max(1, bins.length), peak = 0, points = [], i, v, x, y;
    for (i = 0; i < bins.length; i++) peak = Math.max(peak, Number(bins[i]) || 0);
    var step = n > 1 ? (w - 2) / (n - 1) : 0;
    for (i = 0; i < n; i++) {
      v = Number(bins[i]) || 0;
      x = 1 + i * step;
      y = (h - 1) - (peak > 0 ? v / peak * (h - 4) : 0);
      points.push((Math.round(x * 10) / 10).toFixed(1) + "," +
                  (Math.round(y * 10) / 10).toFixed(1));
    }
    return points;
  }
  function num(value) {
    return value === null || value === undefined
      ? "\u2014" : Number(value).toFixed(1);
  }
  // Every gauge on the page, by the one hook: the header's, and on the
  // Console the wider one, which /api/console.json does not carry bins for.
  function sparks(nav) {
    var tokens = nav.tokens;
    if (!tokens || !tokens.bins) return;
    var bins = tokens.bins, peak = 0, i;
    for (i = 0; i < bins.length; i++) peak = Math.max(peak, Number(bins[i]) || 0);
    var minutes = Number(tokens.bin_minutes) || 5;
    var total = minutes * bins.length;
    var span = total >= 60 ? (total / 60) + " h" : total + " min";
    var title = "tokens completed, last " + span + " in " + minutes +
                "-min bins · peak " + peak.toLocaleString("en-US") +
                " · decode " + num(tokens.decode_tok_s) + " tok/s";
    document.querySelectorAll('[data-nav="tokens"]').forEach(function (svg) {
      var w = Number(svg.getAttribute("width")) || 72;
      var h = Number(svg.getAttribute("height")) || 14;
      var points = sparkPoints(bins, w, h);
      var line = svg.querySelector(".spark-line");
      var area = svg.querySelector(".spark-area");
      var now = svg.querySelector(".spark-now");
      if (line) line.setAttribute("d", "M" + points.join(" L"));
      if (area) area.setAttribute("d", "M1," + (h - 1) + " L" + points.join(" L") +
                                       " L" + (w - 1) + "," + (h - 1) + " Z");
      if (now) {
        var last = points[points.length - 1].split(",");
        now.setAttribute("cx", last[0]);
        now.setAttribute("cy", last[1]);
      }
      var label = svg.querySelector("title");
      if (label) label.textContent = title;
      svg.setAttribute("aria-label", title);
    });
    mark("decode", num(tokens.decode_tok_s));
    // the wider gauge's caption, so the numbers under the line are the line's
    mark("peak", peak.toLocaleString("en-US"));
    mark("session-in", (Number(tokens.session_in) || 0).toLocaleString("en-US"));
    mark("session-out", (Number(tokens.session_out) || 0).toLocaleString("en-US"));
  }
  // The status card. Every value it shows carries data-act, and every one of
  // them is written with textContent, never innerHTML: a detail line is a
  // sentence a model wrote about a sketch a student asked for, and the trail
  // is three more of them. The server has already decided the pill, the
  // elapsed text and the bar's percentage — one mapping from state to colour,
  // in Python, where the state itself is decided.
  function activity(a) {
    if (!a) return;
    document.querySelectorAll("[data-act]").forEach(function (el) {
      var key = el.getAttribute("data-act");
      if (key === "pill") {
        el.textContent = a.pill_text || "";
        el.className = "pill " + (a.pill_class || "quiet");
      } else if (key === "elapsed") {
        el.textContent = a.elapsed_text || "—";
      } else if (key === "track") {
        // The track is always there; its class says which of the three it is.
        el.className = "bar" + (a.bar_class ? " " + a.bar_class : "");
      } else if (key === "bar") {
        var pct = Number(a.bar_pct) || 0;
        el.style.width = pct.toFixed(1) + "%";
        el.className = a.median_s && a.elapsed_s > a.median_s ? "over" : "";
      } else if (key === "recent") {
        var rows = a.recent || [];
        el.textContent = "";
        if (!rows.length) {
          var empty = document.createElement("li");
          var none = document.createElement("span");
          none.className = "h";
          none.textContent = "nothing before this";
          empty.appendChild(none);
          el.appendChild(empty);
        }
        rows.slice(0, 3).forEach(function (row) {
          var li = document.createElement("li");
          var head = document.createElement("span");
          head.className = "h";
          head.textContent = row.headline || "";
          var secs = document.createElement("span");
          secs.className = "s";
          secs.textContent = row.seconds === null || row.seconds === undefined
            ? "" : dur(row.seconds);
          li.appendChild(head);
          li.appendChild(secs);
          el.appendChild(li);
        });
      } else if (key === "foot") {
        // The foot's three values are the collector's (up since, slot) and
        // this poll does not call the collector. Left as the page rendered it.
      } else if (a[key] !== undefined) {
        el.textContent = a[key] === null ? "" : String(a[key]);
      }
    });
  }
  // web.py:human_seconds, for the trail's durations only.
  function dur(seconds) {
    var s = Math.max(0, Math.round(Number(seconds) || 0));
    if (s < 60) return s + "s";
    if (s < 3600) return (s / 60 | 0) + "m " + String(s % 60).padStart(2, "0") + "s";
    if (s < 86400) return (s / 3600 | 0) + "h " +
                          String((s % 3600) / 60 | 0).padStart(2, "0") + "m";
    return (s / 86400 | 0) + "d " + ((s % 86400) / 3600 | 0) + "h";
  }
  function tick() {
    fetch("/api/control.json", {cache: "no-store"}).then(function (r) {
      return r.json();
    }).then(function (d) {
      pill.textContent = d.pill;
      pill.className = "pill " + d.pill_class;
      pill.title = d.title || "";
      activity(d.activity);
      var nav = d.nav;
      if (!nav) return;
      meter(nav);
      sparks(nav);
      mark("queued", nav.queued);
      mark("in-flight", nav.in_flight);
      mark("failed", nav.failed_session);
      mark("held", nav.held,
           nav.held + " waiting · " + nav.kept + " kept rejections below them");
      mark("public", nav.public, nav.public + " public · " + nav.published +
           " published, " + (nav.public - nav.published) + " kept");
    }).catch(function () {});
  }
  setInterval(tick, 2000);
})();
</script>
$page_script
</body>
</html>
