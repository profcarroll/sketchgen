<div class="card" data-entry="$entry_id" data-rules="$rules" data-executor="$executor" data-published="$published" data-search="$search">
      <p class="thumb"><a href="$href"><img src="$strip" alt="four frames from entry $entry_id" loading="lazy"></a></p>
      <p class="card-prompt"><a href="$href">$prompt</a></p>
      <p class="card-meta">$chip<span class="tag">$rules</span> <span class="tag">$executor</span> <span class="tag">$submitted_by</span></p>
      <p class="card-scores">humans <span class="score-value">$human</span> · agents <span class="score-value">$agent</span></p>
      $briefs
      <p class="card-counts"><span class="count" data-count="views">—</span> views · <span class="count" data-count="likes">—</span> likes</p>
      $reason
    </div>
